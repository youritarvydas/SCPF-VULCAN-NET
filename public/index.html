<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP-Net</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">

        <main class="content">
            <h1 class="title">Welcome to SCP-Net!</h1>

            <div class="buttons">
                <a class="login-button roblox" href="/login/roblox">
                    <span class="icon">◈</span>
                    Login with Roblox
				</a>

                <a class="login-button discord" href="/login/discord">
                    <span class="icon">●</span>
                    Login with Discord
				</a>
            </div>
        </main>

        <div class="cookie">
            <div class="footer-links">
                <a href="#">⚖ Privacy Policy</a>
                <a href="#">▤ Terms of Service</a>
            </div>

            <div class="cookie-text">
                We use one essential cookie to keep you signed in.
                We do not use tracking or analytics cookies.
                Read <a href="#">our policies</a> for more details.
            </div>

            <button class="understood"
                    onclick="document.querySelector('.cookie').style.display='none'">
                Understood
            </button>
        </div>

    </div>
</body>
</html>
